[project]
name = "mb-ceramics-catalogue"
version = "0.2.0"
description = "Collection, loading and scheduled operation of the ceramics reference catalogue"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mb-commerce-scraper==0.1.0",
  # Cron expressions for `catalogue.schedules`. A five-field parser is eighty
  # lines and gets DST wrong in ways nobody notices until the clocks change.
  "croniter>=6.0",
  "httpx[socks]>=0.27,<1",
  "nats-py>=2.11,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4",
]

[project.optional-dependencies]
# The terminal displays. A worker in a container has no terminal and should not
# carry rich or textual, so they are not a hard dependency of the package.
tui = [
  "rich>=15.0.0",
  "textual>=8.2.8",
]
# Everything that talks to PostgreSQL: the loader, the worker and the sinks.
postgres = [
  "psycopg[binary,pool]>=3.2,<4",
]
# Camoufox is most of the image size, and only two sources need it (§5.5).
browser = [
  "camoufox>=0.5,<0.6",
  # Directly pinned because the CDP adapter is a supported client, not an
  # accidental consumer of whichever Playwright Camoufox happens to install.
  # It attaches to operator Chromium and never downloads/launches Chromium.
  "playwright==1.60.0",
]
# A browser TLS handshake for the handful of hosts that fingerprint ours and
# refuse it. Optional for the same reason camoufox is: most sources never need
# it, and a worker without it degrades to "this host refuses us".
impersonate = [
  "curl-cffi>=0.7,<1",
]
# The response-cache archive tool talks S3 to R2. Only the machine that
# publishes a cache and the CI job that fetches one need it; a worker replaying
# a cache it already has should not carry an AWS SDK.
archive = [
  "boto3>=1.35,<2",
]
# Wired always, exporting only when OTEL_EXPORTER_OTLP_ENDPOINT is set (§4.7).
otel = [
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-instrumentation-httpx>=0.48b0",
  "opentelemetry-exporter-otlp-proto-http>=1.27",
]
all = [
  "mb-ceramics-catalogue[tui,postgres,browser,impersonate,otel]",
]

[project.scripts]
catalogue-dump = "mb_ceramics_catalogue.cli.dump:main"
catalogue-load = "mb_ceramics_catalogue.cli.load:main"
catalogue-probe = "mb_ceramics_catalogue.cli.probe:main"
catalogue-worker = "mb_ceramics_catalogue.cli.worker:main"
catalogue-dispatcher = "mb_ceramics_catalogue.cli.dispatcher:main"
catalogue-maintain = "mb_ceramics_catalogue.cli.maintain:main"
catalogue-benchmark = "mb_ceramics_catalogue.cli.benchmark:main"
catalogue-proxy-budget = "mb_ceramics_catalogue.cli.proxy_budget:main"
catalogue-migrate = "mb_ceramics_catalogue.cli.migrate:main"
catalogue-proxy-roles = "mb_ceramics_catalogue.ops.proxy_roles:main"
catalogue-compact = "mb_ceramics_catalogue.cli.compact:main"
catalogue-source-config = "mb_ceramics_catalogue.cli.source_config:main"
catalogue-source-health = "mb_ceramics_catalogue.cli.source_health:main"
catalogue-shadow-compare = "mb_ceramics_catalogue.cli.shadow_compare:main"
catalogue-queue-admin = "mb_ceramics_catalogue.cli.queue_admin:main"
catalogue-db-transfer = "mb_ceramics_catalogue.ops.database_transfer:main"
catalogue-cache-archive = "mb_ceramics_catalogue.ops.cache_archive:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
  "mb-ceramics-catalogue[tui,postgres,browser,impersonate,otel,archive]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mb_ceramics_catalogue"]

[tool.hatch.build.targets.wheel.force-include]
# sources.json is data the package reads at runtime, not a development file.
"sources.json" = "mb_ceramics_catalogue/data/sources.json"

[tool.uv]
# A real package now: `uv sync` installs it in editable mode, so an import
# resolves through the installed distribution rather than through whichever
# directory happened to be the working one.
package = true

[tool.uv.sources]
# Editable: without it uv installs a *copy*, so library edits are invisible to
# this suite and cross-package changes get validated against a stale snapshot.
# The installed-wheel gates deliberately test the built artifact instead and
# are unaffected by this.
mb-commerce-scraper = { path = "../commerce-scraper", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# The suite is a mix of the original unittest classes and plain pytest
# functions; pytest runs both, so the classes did not need rewriting.
asyncio_mode = "auto"
# Replaying every cached source reads ten thousand entries and takes minutes,
# which is the wrong default for a suite that should be run on every save. CI
# runs `pytest -m golden` as its own step.
addopts = "-m 'not golden and not postgres and not camoufox'"
filterwarnings = ["error::DeprecationWarning:mb_ceramics_catalogue.*"]
markers = [
  "golden: replays recorded responses and compares against a frozen dump",
  "postgres: needs a live PostgreSQL; skipped when CATALOGUE_TEST_DSN is unset",
  "nats: needs a live disposable NATS JetStream; skipped when CATALOGUE_TEST_NATS_URL is unset",
  "camoufox: needs the downloaded local Camoufox browser runtime",
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", ".cache", "catalogue-dumps*"]

[tool.ruff.lint]
select = [
  "E", "F", "W",      # pycodestyle, pyflakes
  "I",                # import order
  "UP",               # pyupgrade
  "B",                # bugbear
  "C4",               # comprehensions
  "SIM",              # simplify
  "RUF",
  "BLE",              # the blind-except rule the `# noqa: BLE001` comments assume
  "ASYNC",
]
ignore = [
  "E501",   # line length is enforced by the formatter, not the linter
  "SIM108", # a ternary is not always clearer than an if
  "RUF001", # the catalogue is multilingual; ambiguous unicode is the data
  "RUF002",
  "RUF003",
  # This is an asyncio codebase, not a trio one. A `mkdir` in an entry point is
  # not the blocking call this rule is warning about, and the alternative it
  # recommends would mean adding anyio to avoid a syscall that takes microseconds.
  "ASYNC240",
]

[tool.ruff.lint.per-file-ignores]
# ASYNC109/110 tell you to take an Event rather than poll with a timeout. That
# is right for production code and wrong for a test that watches state the code
# under test owns and does not signal — `Progress.running` is a set, not an
# event source. The polling helper exists so a bug becomes a red assertion
# instead of a suite that never finishes.
"tests/*" = ["BLE", "B011", "C408", "ASYNC109", "ASYNC110"]

# The 4,700 lines of site-specific collection are the asset this whole refactor
# exists to protect, and the plan's rule is that they move without a line
# changing. Style rules are therefore switched off for them: reformatting a
# scraper buys nothing and invalidates the golden file that is the only proof
# the refactor changed no output. Correctness rules (F, B023, BLE) stay on —
# they are how the `target` NameError in `Fetcher.render` was found.
"src/mb_ceramics_catalogue/scrapers/*" = ["SIM", "C4", "B905", "E701"]
"src/mb_ceramics_catalogue/ui/*" = ["SIM", "C4", "E701"]

# Standalone development aids, imported by nothing and not part of the package
# in §4.2. They are linted for real faults, not for house style.
"adapters.py" = ["E701", "B023"]
"smoke_sources.py" = ["BLE001"]
"export_speedball.py" = ["E701", "C4", "SIM"]
"extract_pdf_tiles.py" = ["E701", "C4", "SIM"]

[tool.mypy]
# Deliberately not pinned to 3.11: mypy would then read the installed numpy
# stubs (a camoufox dependency) as 3.11 source and reject their `type`
# statements before checking a line of this project. The floor is enforced by
# `requires-python` and by CI running the suite on 3.11.
files = ["src/mb_ceramics_catalogue", "tests"]
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
follow_imports_for_stubs = false

# Everything written for this plan is checked strictly. The point of the §4.2
# layout is that new code has no excuse; the scrapers below are the exception,
# and they are the only one.
[[tool.mypy.overrides]]
module = [
  "mb_ceramics_catalogue.cli.*",
  "mb_ceramics_catalogue.config.*",
  "mb_ceramics_catalogue.crawl.*",
  "mb_ceramics_catalogue.observability.*",
  "mb_ceramics_catalogue.ops.*",
  "mb_ceramics_catalogue.storage.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true

# The 4,700 lines of site-specific collection are checked, but not strictly:
# holding the refactor hostage to fully typing them would stop it happening.
#
# The disabled codes are the two patterns that account for every one of the 53
# errors these files produce, and neither is a defect:
#
#  * every scraper assembles a `dict[str, Any]` of extracted fields and splats
#    it into `record.build(**row)`. mypy cannot match a heterogeneous dict
#    against a typed signature, so one call site yields eight errors naming
#    parameters that are in fact being passed correctly;
#  * `urllib.robotparser.RobotFileParser` really does have `allow_all` and
#    `disallow_all` (set in its `__init__`) and really does return a number
#    from `crawl_delay`; typeshed declares neither. `Fetcher._read_robots`
#    depends on all three and is correct.
#
# Everything that would catch a real fault — undefined names, bad calls, bad
# assignments — stays on. That is how `Fetcher.render`'s NameError was found.
[[tool.mypy.overrides]]
module = "mb_ceramics_catalogue.scrapers.*"
disallow_untyped_defs = false
check_untyped_defs = true
disable_error_code = ["arg-type", "attr-defined", "union-attr", "return-value"]

[[tool.mypy.overrides]]
module = "mb_ceramics_catalogue.ui.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["camoufox.*", "textual.*", "rich.*", "opentelemetry.*", "croniter.*", "boto3.*"]
ignore_missing_imports = true
