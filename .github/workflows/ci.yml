# Lint, types, contracts and tests for the ceramics catalogue pipeline.
#
# Four jobs rather than one, because they answer different questions and fail
# for different reasons. `check` is fast and runs on every push. `postgres`
# needs a database. `golden` replays ten thousand recorded responses to prove
# the collection output has not moved, which takes minutes and is the thing the
# refactor is checked against.
#
# Every path here is relative to the repository root, which is also the project
# root. It was not always: this file was written against a monorepo layout that
# put the project under a `catalogue-ceramics/` subdirectory, and carried a
# `defaults.run.working-directory` and a set of `paths:` filters to match. No
# such directory exists. The filters therefore matched no file, so the push
# trigger never fired, and the image builds could not resolve their context --
# the workflow had never completed a single run.
name: catalogue-ceramics

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalogue-ceramics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, contracts and unit tests
    runs-on: ubuntu-latest
    # The explorer's brand package lives in GitHub Packages, which npm cannot
    # reach anonymously even for a package in the same org as this repository.
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in requires-python, and the version the project is
        # developed on. A `type` statement or a 3.12-only builtin would pass
        # locally and break the image, so the floor is exercised rather than
        # asserted.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: catalogue-explorer/package-lock.json
      - name: Authenticate to GitHub Packages
        run: npm config set --location=user //npm.pkg.github.com/:_authToken "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync every project
        run: |
          for project in catalogue-dump catalogue-control catalogue-service; do
            uv --directory "$project" sync --all-groups --python ${{ matrix.python }}
          done
          cd catalogue-explorer && npm ci
      - run: make lint
      - run: make typecheck
      - run: make test
      - name: Build and verify the reusable scraper distribution
        run: make scraper-build scraper-contracts
      - name: Verify installed catalogue and scraper composition
        run: make catalogue-artifact-contracts
      # Never hand-edit a generated OpenAPI document. This is what stops
      # "regenerate it later" from becoming "the spec is six months old".
      - name: Check the generated contracts have not drifted
        run: make openapi-check

  postgres:
    name: Queue, edges, run closure and the control API
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: '**/uv.lock'
      - name: Sync
        run: |
          uv --directory catalogue-dump sync --all-groups
          uv --directory catalogue-control sync --all-groups
      - name: Run the database-backed suites
        run: make test-postgres
        env:
          # These drop and recreate the `catalogue` schema, so this must be a
          # database nothing else is using. A CI service container is.
          PGTEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  golden:
    name: Replay the recorded catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: catalogue-dump/uv.lock
      - name: Sync
        run: uv --directory catalogue-dump sync --all-groups
      # Until the bucket, the machine identity and a published archive all
      # exist, these two steps are skipped and the golden tests skip with an
      # empty cache — which is exactly what this job did before. Setting the
      # INFISICAL_PROJECT_SLUG variable is what turns the gate on, and the
      # `Confirm` step below is what stops a missing variable from reading as a
      # passing replay for a second time.
      #
      # The only secrets in this repository are the machine identity itself.
      # Everything the job actually uses is read from Infisical at run time, so
      # rotating an R2 key is a change in one place and never a commit here.
      #
      # Two curl calls rather than Infisical's action: this repository allows a
      # short list of actions and pins every one of them to a SHA, and the API
      # is stable enough that adding a third-party action to the supply chain
      # buys nothing. The identity logs in, reads one path, and the values are
      # masked before they reach the environment.
      - name: Read the cache credentials from Infisical
        if: vars.INFISICAL_PROJECT_SLUG != ''
        env:
          CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
        run: |
          set -euo pipefail
          token=$(curl -sS --fail-with-body \
            -X POST https://app.infisical.com/api/v1/auth/universal-auth/login \
            -H 'Content-Type: application/json' \
            -d "$(jq -nc --arg id "$CLIENT_ID" --arg secret "$CLIENT_SECRET" \
                  '{clientId: $id, clientSecret: $secret}')" \
            | jq -r .accessToken)
          echo "::add-mask::$token"

          secrets=$(curl -sS --fail-with-body -G \
            https://app.infisical.com/api/v3/secrets/raw \
            -H "Authorization: Bearer $token" \
            --data-urlencode "workspaceSlug=$PROJECT_SLUG" \
            --data-urlencode "environment=ci" \
            --data-urlencode "secretPath=/catalogue/cache")

          # Mask before export: a value that reaches the log unmasked is
          # rotated, not un-logged.
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY \
                      CATALOGUE_CACHE_BUCKET CATALOGUE_CACHE_ENDPOINT; do
            value=$(jq -r --arg n "$name" \
              '.secrets[] | select(.secretKey == $n) | .secretValue' <<<"$secrets")
            if [ -z "$value" ] || [ "$value" = "null" ]; then
              echo "::error::$name is not set at /catalogue/cache in the ci environment"
              exit 1
            fi
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      # The identity this job authenticates as can read the cache archive and
      # nothing else. A build has no reason to be able to publish one.
      - name: Fetch the recorded response cache
        if: vars.INFISICAL_PROJECT_SLUG != ''
        run: uv --directory catalogue-dump run -- catalogue-cache-archive pull --force
      - name: Replay every cached source
        run: make test-golden
      # A skipped replay is not a passing replay. Once the cache is provisioned
      # this fails the job if the suite quietly collected nothing, which is the
      # failure mode that hid a dormant golden suite for months.
      - name: Confirm the replay actually replayed something
        if: vars.INFISICAL_PROJECT_SLUG != ''
        run: |
          test -d catalogue-dump/.cache || {
            echo "::error::the response cache was not fetched; the replay asserted nothing"
            exit 1
          }
      - name: Keep the differing output for inspection
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: golden-replay-diff
          path: /tmp/golden-*/
          if-no-files-found: ignore

  images:
    name: Build the images
    runs-on: ubuntu-latest
    # The explorer image installs @makersbrain/brand from GitHub Packages, which
    # npm cannot reach anonymously even for a package in this repository's own
    # organisation. The other three images are Python and need nothing.
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # Built but not pushed: this proves the Dockerfiles still work against the
      # current source, which a compose file alone does not.
      - name: Worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/worker/Dockerfile
          target: worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Browser worker
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/worker/Dockerfile
          target: worker-browser
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Control
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/control/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Read API
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: catalogue-service/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Loader
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/loader/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Database transfer tool
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/database-transfer/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Backup and restore tool
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/backup/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The explorer was the one image nothing built, and it is the one with a
      # build that can fail on its own: the other three install from PyPI, this
      # one needs a credential for GitHub Packages. A broken secret mount or an
      # unpublished brand version would have surfaced at deploy time rather than
      # here.
      #
      # The credential is written to a file rather than passed with `secrets:`
      # because the Dockerfile mounts it at `/root/.npmrc`, so what the secret
      # has to contain is a whole npmrc, not a token. `secret-files` keeps the
      # multi-line value out of the workflow's argument list.
      - name: Write an npmrc for the explorer build
        run: |
          printf '@makersbrain:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' \
            "$GITHUB_TOKEN" > "$RUNNER_TEMP/npmrc"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Explorer
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./catalogue-explorer
          push: false
          secret-files: |
            npmrc=${{ runner.temp }}/npmrc
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Drop the npmrc
        if: always()
        run: rm -f "$RUNNER_TEMP/npmrc"
