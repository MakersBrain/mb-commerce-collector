[project]
name = "mb-commerce-scraper"
version = "0.1.0"
description = "Extensible, dataset-neutral commerce collection library"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "Proprietary"}
dependencies = ["pydantic>=2.9,<3"]

[project.optional-dependencies]
http = ["httpx[socks]>=0.27,<1"]
dev = [
  "build>=1.2",
  "httpx[socks]>=0.27,<1",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mb_commerce_scraper"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "BLE", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
files = ["src/mb_commerce_scraper", "tests"]
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
