[project]
name = "example-commerce-connector"
version = "0.1.0"
description = "Example third-party connector for mb-commerce-scraper"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "mb-commerce-scraper==0.1.0",
  "pydantic>=2.9,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/example_commerce_connector"]

[project.entry-points."mb_commerce_scraper.connectors"]
example-feed = "example_commerce_connector:connector_factory"
