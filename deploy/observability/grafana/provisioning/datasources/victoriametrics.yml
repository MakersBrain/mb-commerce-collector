apiVersion: 1

# VictoriaMetrics serves the Prometheus querying API on 8428, so the stock
# prometheus datasource type works unchanged and MetricsQL stays available as a
# PromQL superset. The dashboards pin no datasource uid, so they follow
# isDefault; deleteDatasources drops the old entry from the persisted
# grafana-data volume, which provisioning would otherwise leave behind.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: VictoriaMetrics
    type: prometheus
    access: proxy
    url: http://victoriametrics:8428
    isDefault: true
    editable: false
