# Read by VictoriaMetrics via -promscrape.config. Same format as Prometheus,
# minus rule_files: rule evaluation lives in vmalert, not in the storage node,
# and minus the per-job dns_sd refresh interval, which VictoriaMetrics sets
# globally via -promscrape.dnsSDCheckInterval instead.
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: catalogue-control
    static_configs:
      - targets: [control:8687]

  - job_name: catalogue-service
    static_configs:
      - targets: [service:8686]

  - job_name: catalogue-dispatcher
    static_configs:
      - targets: [dispatcher:9110]

  - job_name: catalogue-worker
    dns_sd_configs:
      - names: [worker]
        type: A
        port: 9109
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: pool
        replacement: plain

  - job_name: catalogue-worker-browser
    dns_sd_configs:
      - names: [worker-browser]
        type: A
        port: 9109
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: pool
        replacement: browser
