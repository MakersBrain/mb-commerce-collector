# Local PostgreSQL for the ceramics reference catalogue.
#
# Brings up an empty database with the `catalogue` schema already applied, so
# catalogue-dump/load_postgres.py can stream the NDJSON dumps straight into it.
# This is a development database, separate from the application stack in
# ateliera-app/deploy/docker-compose.yml, and it publishes a different port.
name: catalogue-ceramics

services:
  nats:
    image: nats:2.11-alpine
    container_name: catalogue-nats
    # Development ports are loopback-only. Production uses the role-scoped
    # credentials described in docs/queue-provider-runbook.md.
    command: ["--jetstream", "--store_dir=/data", "--http_port=8222"]
    ports:
      - "127.0.0.1:${CATALOGUE_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${CATALOGUE_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Provisioning is an administrative action, never a publisher/consumer side
  # effect. Keeping it explicit also makes local startup match production.
  nats-init:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker
    depends_on:
      nats:
        condition: service_healthy
    environment:
      CATALOGUE_QUEUE_PROVIDER: nats
      CATALOGUE_NATS_URL: nats://nats:4222
    entrypoint: ["catalogue-queue-admin"]
    command: ["apply"]
    restart: "no"

  postgres:
    image: postgres:17-alpine
    container_name: catalogue-postgres
    # Loopback only, for a psql or a query tool on the host; nothing off this
    # machine needs to reach it. 5434 keeps it clear of the application stack
    # on 5433 and of any system PostgreSQL on 5432.
    ports:
      - "127.0.0.1:${CATALOGUE_DB_PORT:-5434}:5432"
    environment:
      POSTGRES_DB: ${CATALOGUE_DB_NAME:-ateliera}
      POSTGRES_USER: ${CATALOGUE_DB_USER:-catalogue}
      POSTGRES_PASSWORD: ${CATALOGUE_DB_PASSWORD:-catalogue}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied once, in filename order, the first time the volume is empty.
      #
      # One schema file, not the eleven versioned ones it replaces: keeping an
      # order-sensitive list here in step with `storage.db.SCHEMA_FILES` was a
      # standing bug, and the compose side had already fallen a version behind.
      #
      # It lives under the package (src/.../storage/schema) rather than beside
      # this file so a worker can apply the same DDL from an installed
      # distribution - see `storage.db.apply_schema`.
      - ./docker/initdb/00-extensions.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
      - ./catalogue-dump/src/mb_ceramics_catalogue/storage/schema/catalogue-schema.sql:/docker-entrypoint-initdb.d/10-catalogue-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 3s
      # initdb replays the schema before the server accepts connections.
      start_period: 30s
      retries: 10

  # The catalogue's read API. Cross-tenant reference data served to every tenant
  # and owned by none of them, which is why it is a service in front of the
  # database rather than a connection string handed to each tenant.
  #
  # Not published on the host: the only thing that needs it is another container,
  # and it joins this stack's network to reach it.
  service:
    build:
      # The build context is the repository root: the read API installs the
      # shared OpenAPI registry from catalogue-dump as a path dependency.
      context: .
      dockerfile: catalogue-service/Dockerfile
    container_name: catalogue-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOGUE_DSN: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8686/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # One-shot importer, so a load needs no `psql` on the host:
  #
  #   docker compose run --rm loader --dry-run
  #   docker compose run --rm loader --source amaco,mayco
  #
  # Arguments are appended to the entrypoint, so anything load_postgres.py
  # accepts can be passed and a repeated flag wins over the default below.
  # It is behind a profile so `docker compose up` starts the database alone.
  loader:
    profiles: ["loader"]
    build:
      # The build context is the repository root because the image installs the
      # package from catalogue-dump/, rather than reading a script off the mount.
      context: .
      dockerfile: docker/loader/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # COPY streams from this process, so the dumps have to be visible to this
      # container rather than to the server.
      - .:/work:ro
    # `catalogue-load` is a console script from the installed distribution.
    # Arguments given to `docker compose run` are appended, so a repeated flag
    # wins over the defaults below.
    command:
      - --dsn
      - postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      - --data
      - /work/catalogue-dumps-v2

  # Explicit one-shot migration for existing named volumes. PostgreSQL only
  # runs /docker-entrypoint-initdb.d on first creation, so rebuilding an image
  # is not a migration strategy.
  migrate:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CATALOGUE_DSN: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
    user: "10001:999"
    entrypoint: ["catalogue-migrate"]

  proxy-db-roles:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CATALOGUE_DSN: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      CATALOGUE_CONTROL_DB_PASSWORD: ${CATALOGUE_CONTROL_DB_PASSWORD:-catalogue-control}
      CATALOGUE_WORKER_DB_PASSWORD: ${CATALOGUE_WORKER_DB_PASSWORD:-catalogue-worker}
      CATALOGUE_PROXY_ARCHIVE_DB_PASSWORD: ${CATALOGUE_PROXY_ARCHIVE_DB_PASSWORD:-catalogue-proxy-archive}
    entrypoint: ["catalogue-proxy-roles"]
    restart: "no"

  proxy-secrets-init:
    image: alpine:3.22
    user: "0:0"
    volumes:
      - proxy-secrets:/run/proxy-secrets
    command:
      - sh
      - -ec
      - |
        install -d -m 0700 -o 10001 -g 10001 /run/proxy-secrets
        if [ ! -e /run/proxy-secrets/profiles.json ]; then
          printf '{}\n' >/run/proxy-secrets/profiles.json
        fi
        chown 10001:10001 /run/proxy-secrets/profiles.json
        chmod 0400 /run/proxy-secrets/profiles.json
    restart: "no"

  # The operator control plane: run/job/worker/source control, and the live
  # stream the /ops pages read. Deliberately not published on the host — the
  # explorer proxies it server-side with the token attached, and the token is
  # the authentication boundary rather than the network.
  control:
    build:
      context: .
      dockerfile: docker/control/Dockerfile
    container_name: catalogue-control
    depends_on:
      postgres:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      proxy-secrets-init:
        condition: service_completed_successfully
      proxy-db-roles:
        condition: service_completed_successfully
    environment:
      CATALOGUE_DSN: postgresql://catalogue_control:${CATALOGUE_CONTROL_DB_PASSWORD:-catalogue-control}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      CATALOGUE_QUEUE_PROVIDER: ${CATALOGUE_QUEUE_PROVIDER:-nats}
      CATALOGUE_NATS_URL: nats://nats:4222
      CATALOGUE_CF_ACCOUNT_ID: ${CATALOGUE_CF_ACCOUNT_ID:-}
      CATALOGUE_CF_STATS_TOKEN_FILE: /run/queue-secrets/cloudflare-stats-token
      CATALOGUE_CF_QUEUE_PLAIN_ID: ${CATALOGUE_CF_QUEUE_PLAIN_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_AUTO_ID: ${CATALOGUE_CF_QUEUE_BROWSER_AUTO_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_CAMOUFOX_ID: ${CATALOGUE_CF_QUEUE_BROWSER_CAMOUFOX_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_CDP_EXTENSION_PROXY_ID: ${CATALOGUE_CF_QUEUE_BROWSER_CDP_EXTENSION_PROXY_ID:-}
      CATALOGUE_CF_QUEUE_RECOVERY_DLQ_ID: ${CATALOGUE_CF_QUEUE_RECOVERY_DLQ_ID:-}
      # No default. The service refuses to start without it, because the one
      # thing worse than having no cancel-run endpoint is an unauthenticated one.
      CATALOGUE_CONTROL_TOKEN: ${CATALOGUE_CONTROL_TOKEN:?set a control token in .env}
      CATALOGUE_ARTIFACTS_DIR: /var/lib/catalogue/dumps
      CATALOGUE_PROXY_ENABLED: ${CATALOGUE_PROXY_ENABLED:-false}
      CATALOGUE_PROXY_SECRET_FILE: /run/proxy-secrets/profiles.json
      CATALOGUE_PROXY_ACTOR_PUBLIC_KEYS_FILE: /run/secrets/operator-public-keys.json
      CATALOGUE_PROXY_PROVIDER_LIMIT_UNIT: ${CATALOGUE_PROXY_PROVIDER_LIMIT_UNIT:-unconfirmed}
      CATALOGUE_PROXY_MUTATIONS_ENABLED: ${CATALOGUE_PROXY_MUTATIONS_ENABLED:-false}
      CATALOGUE_PROXY_PAID_PROBE_ENABLED: ${CATALOGUE_PROXY_PAID_PROBE_ENABLED:-false}
    volumes:
      # Comparison endpoints read immutable scrape artifacts; the control plane
      # never needs permission to alter the audit trail.
      - dumps:/var/lib/catalogue/dumps:ro
      - proxy-secrets:/run/proxy-secrets
      # Provider API access exists only in control. Workers receive generated
      # sub-user credentials through the read-only shared profile volume.
      - ./decodo.env:/run/secrets/decodo.env:ro
      - type: bind
        source: ${CATALOGUE_OPERATOR_PUBLIC_KEYS_FILE:-/dev/null}
        target: /run/secrets/operator-public-keys.json
        read_only: true
      - type: bind
        source: ${CATALOGUE_CF_STATS_TOKEN_FILE:-/dev/null}
        target: /run/queue-secrets/cloudflare-stats-token
        read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8687/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # Transactional outbox publisher and expired-execution reconciler. It may be
  # scaled: SKIP LOCKED divides batches and Nats-Msg-Id deduplicates a commit
  # whose publish acknowledgement was lost.
  dispatcher:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      nats-init:
        condition: service_completed_successfully
      proxy-db-roles:
        condition: service_completed_successfully
    environment:
      CATALOGUE_DSN: postgresql://catalogue_worker:${CATALOGUE_WORKER_DB_PASSWORD:-catalogue-worker}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      CATALOGUE_QUEUE_PROVIDER: ${CATALOGUE_QUEUE_PROVIDER:-nats}
      CATALOGUE_QUEUE_VISIBILITY_SECONDS: ${CATALOGUE_QUEUE_VISIBILITY_SECONDS:-4200}
      CATALOGUE_NATS_URL: nats://nats:4222
      CATALOGUE_CF_ACCOUNT_ID: ${CATALOGUE_CF_ACCOUNT_ID:-}
      CATALOGUE_CF_PUBLISH_TOKEN_FILE: /run/queue-secrets/cloudflare-publish-token
      CATALOGUE_CF_RECOVERY_TOKEN_FILE: /run/queue-secrets/cloudflare-recovery-token
      CATALOGUE_CF_QUEUE_PLAIN_ID: ${CATALOGUE_CF_QUEUE_PLAIN_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_AUTO_ID: ${CATALOGUE_CF_QUEUE_BROWSER_AUTO_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_CAMOUFOX_ID: ${CATALOGUE_CF_QUEUE_BROWSER_CAMOUFOX_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_CDP_EXTENSION_PROXY_ID: ${CATALOGUE_CF_QUEUE_BROWSER_CDP_EXTENSION_PROXY_ID:-}
      CATALOGUE_CF_QUEUE_RECOVERY_DLQ_ID: ${CATALOGUE_CF_QUEUE_RECOVERY_DLQ_ID:-}
      CATALOGUE_LOG_JSON: "true"
    volumes:
      - type: bind
        source: ${CATALOGUE_CF_PUBLISH_TOKEN_FILE:-/dev/null}
        target: /run/queue-secrets/cloudflare-publish-token
        read_only: true
      - type: bind
        source: ${CATALOGUE_CF_RECOVERY_TOKEN_FILE:-/dev/null}
        target: /run/queue-secrets/cloudflare-recovery-token
        read_only: true
    entrypoint: ["catalogue-dispatcher"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:9110/health')\""]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5

  # The collection worker. Scale it with `docker compose up --scale worker=3`;
  # JetStream shares the route across them, and catalogue.hosts is what
  # stops three of them tripling the load on every shop.
  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker
    depends_on:
      postgres:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      proxy-secrets-init:
        condition: service_completed_successfully
      proxy-db-roles:
        condition: service_completed_successfully
    environment:
      CATALOGUE_DSN: postgresql://catalogue_worker:${CATALOGUE_WORKER_DB_PASSWORD:-catalogue-worker}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      CATALOGUE_QUEUE_PROVIDER: ${CATALOGUE_QUEUE_PROVIDER:-nats}
      CATALOGUE_QUEUE_POLL_EMPTY_SECONDS: ${CATALOGUE_QUEUE_POLL_EMPTY_SECONDS:-2}
      CATALOGUE_QUEUE_VISIBILITY_SECONDS: ${CATALOGUE_QUEUE_VISIBILITY_SECONDS:-4200}
      CATALOGUE_NATS_URL: nats://nats:4222
      CATALOGUE_CF_ACCOUNT_ID: ${CATALOGUE_CF_ACCOUNT_ID:-}
      CATALOGUE_CF_CONSUME_TOKEN_FILE: /run/queue-secrets/cloudflare-consume-token
      CATALOGUE_CF_QUEUE_PLAIN_ID: ${CATALOGUE_CF_QUEUE_PLAIN_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_AUTO_ID: ${CATALOGUE_CF_QUEUE_BROWSER_AUTO_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_CAMOUFOX_ID: ${CATALOGUE_CF_QUEUE_BROWSER_CAMOUFOX_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_CDP_EXTENSION_PROXY_ID: ${CATALOGUE_CF_QUEUE_BROWSER_CDP_EXTENSION_PROXY_ID:-}
      CATALOGUE_CF_QUEUE_RECOVERY_DLQ_ID: ${CATALOGUE_CF_QUEUE_RECOVERY_DLQ_ID:-}
      # Sources are independent and mostly waiting on someone else's network, so
      # one at a time leaves the process idle for most of a run. Two jobs on one
      # shop are still prevented by catalogue.host_leases, which is per host and
      # cross-process rather than per worker.
      CATALOGUE_JOB_SLOTS: ${CATALOGUE_JOB_SLOTS:-4}
      CATALOGUE_PROXY_ENABLED: ${CATALOGUE_PROXY_ENABLED:-false}
      CATALOGUE_PROXY_SECRET_FILE: /run/proxy-secrets/profiles.json
    volumes:
      # Shared, so a replay works across workers and a run's artifacts are all
      # in one place. The cache is sharded per host and the dumps are namespaced
      # <run-id>/<job-id>/, so concurrent writers never collide.
      - cache:/var/lib/catalogue/cache
      - dumps:/var/lib/catalogue/dumps
      - proxy-secrets:/run/proxy-secrets:ro
      - type: bind
        source: ${CATALOGUE_CF_CONSUME_TOKEN_FILE:-/dev/null}
        target: /run/queue-secrets/cloudflare-consume-token
        read_only: true
    restart: unless-stopped
    # SIGTERM drains: finish the current source, requeue anything unfinished,
    # mark the worker stopped. The default ten seconds is not enough to write a
    # four-thousand-record artifact.
    stop_grace_period: 150s

  # Sources that need camoufox, on a separate image so the plain worker does not
  # carry a browser. Keep four replicas so browser-backed runs can make progress
  # across independent shops concurrently.
  #
  # `deploy/quadlet/catalogue-worker-browser.container` had three settings this
  # never did, and every one of them turned out to matter here too. Between
  # 2026-08-10 and 2026-08-12 the browser-backed sources kept their request
  # counts exactly and lost two orders of magnitude of speed — toepferspass
  # rendering nine pages in 4,862 seconds — and two of them stopped finishing
  # inside their deadline at all.
  worker-browser:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
      target: worker-browser
    depends_on:
      postgres:
        condition: service_healthy
      nats-init:
        condition: service_completed_successfully
      proxy-secrets-init:
        condition: service_completed_successfully
      proxy-db-roles:
        condition: service_completed_successfully
    environment:
      CATALOGUE_DSN: postgresql://catalogue_worker:${CATALOGUE_WORKER_DB_PASSWORD:-catalogue-worker}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      CATALOGUE_QUEUE_PROVIDER: ${CATALOGUE_QUEUE_PROVIDER:-nats}
      CATALOGUE_QUEUE_POLL_EMPTY_SECONDS: ${CATALOGUE_QUEUE_POLL_EMPTY_SECONDS:-2}
      CATALOGUE_QUEUE_VISIBILITY_SECONDS: ${CATALOGUE_QUEUE_VISIBILITY_SECONDS:-4200}
      CATALOGUE_NATS_URL: nats://nats:4222
      CATALOGUE_CF_ACCOUNT_ID: ${CATALOGUE_CF_ACCOUNT_ID:-}
      CATALOGUE_CF_CONSUME_TOKEN_FILE: /run/queue-secrets/cloudflare-consume-token
      CATALOGUE_CF_QUEUE_PLAIN_ID: ${CATALOGUE_CF_QUEUE_PLAIN_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_AUTO_ID: ${CATALOGUE_CF_QUEUE_BROWSER_AUTO_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_CAMOUFOX_ID: ${CATALOGUE_CF_QUEUE_BROWSER_CAMOUFOX_ID:-}
      CATALOGUE_CF_QUEUE_BROWSER_CDP_EXTENSION_PROXY_ID: ${CATALOGUE_CF_QUEUE_BROWSER_CDP_EXTENSION_PROXY_ID:-}
      CATALOGUE_CF_QUEUE_RECOVERY_DLQ_ID: ${CATALOGUE_CF_QUEUE_RECOVERY_DLQ_ID:-}
      # camoufox leaks across jobs. A process that has rendered a few hundred
      # pages is one that gets killed by the OOM reaper mid-write, so it is
      # recycled between jobs instead — `restart: unless-stopped` restarts it.
      CATALOGUE_MAX_JOBS: ${CATALOGUE_BROWSER_MAX_JOBS:-25}
      # One job at a time here, and up to this many pages open in the one
      # browser this process now shares between them. Stated rather than left
      # to the defaults: these two figures are what the machine's share of a
      # render is, and they should be visible next to the replica count.
      CATALOGUE_JOB_SLOTS: ${CATALOGUE_BROWSER_JOB_SLOTS:-1}
      CATALOGUE_BROWSER_PAGES: ${CATALOGUE_BROWSER_PAGES:-2}
      CATALOGUE_PROXY_ENABLED: ${CATALOGUE_PROXY_ENABLED:-false}
      CATALOGUE_PROXY_SECRET_FILE: /run/proxy-secrets/profiles.json
    volumes:
      - cache:/var/lib/catalogue/cache
      - dumps:/var/lib/catalogue/dumps
      - proxy-secrets:/run/proxy-secrets:ro
      - type: bind
        source: ${CATALOGUE_CF_CONSUME_TOKEN_FILE:-/dev/null}
        target: /run/queue-secrets/cloudflare-consume-token
        read_only: true
    # Docker's default is 64 MB, and camoufox needs rather more: below this it
    # renders, slowly and then not at all, rather than failing outright.
    shm_size: 512m
    # And a writable /tmp, which it wants for its profile.
    tmpfs:
      - /tmp
    restart: unless-stopped
    deploy:
      replicas: 4
    stop_grace_period: 150s

  # The catalogue explorer, including the /ops pages. Published on loopback for
  # development; behind Caddy in production, which needs `flush_interval -1` on
  # the reverse_proxy or the SSE stream arrives in blocks rather than as it is
  # written.
  operator-secrets-init:
    profiles: ["ui"]
    image: alpine:3.22
    user: "0:0"
    volumes:
      - type: bind
        source: ${CATALOGUE_OPERATOR_PRIVATE_KEY_FILE:-/dev/null}
        target: /seed/operator-private-key.pem
        read_only: true
      - operator-secrets:/run/operator-secrets
    command:
      - sh
      - -ec
      - |
        install -d -m 0700 -o 10001 -g 10001 /run/operator-secrets
        install -m 0400 -o 10001 -g 10001 \
          /seed/operator-private-key.pem /run/operator-secrets/operator-private-key.pem
    restart: "no"

  explorer:
    profiles: ["ui"]
    # The build installs @makersbrain/brand from GitHub Packages. The credential
    # is handed to BuildKit as a secret rather than baked in, so it is mounted
    # only for the `npm ci` layer. It comes from the developer's own ~/.npmrc;
    # set NPMRC to point somewhere else.
    build:
      context: ./catalogue-explorer
      secrets:
        - npmrc
    container_name: catalogue-explorer
    depends_on:
      postgres:
        condition: service_healthy
      operator-secrets-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${CATALOGUE_UI_PORT:-5175}:3000"
    environment:
      DATABASE_URL: postgresql://${CATALOGUE_DB_USER:-catalogue}:${CATALOGUE_DB_PASSWORD:-catalogue}@postgres:5432/${CATALOGUE_DB_NAME:-ateliera}
      CATALOGUE_CONTROL_URL: http://control:8687
      CATALOGUE_CONTROL_TOKEN: ${CATALOGUE_CONTROL_TOKEN:?set a control token in .env}
      CATALOGUE_OPERATOR_ID_HEADER: ${CATALOGUE_OPERATOR_ID_HEADER:-cf-access-authenticated-user-email}
      CATALOGUE_OPERATOR_AUTH_TIME_HEADER: ${CATALOGUE_OPERATOR_AUTH_TIME_HEADER:-x-catalogue-auth-time}
      CATALOGUE_OPERATOR_ADMINS: ${CATALOGUE_OPERATOR_ADMINS:-}
      CATALOGUE_OPERATOR_VIEWERS: ${CATALOGUE_OPERATOR_VIEWERS:-}
      CATALOGUE_OPERATOR_ASSERTION_PRIVATE_KEY_FILE: /run/operator-secrets/operator-private-key.pem
      CATALOGUE_OPERATOR_ASSERTION_KEY_ID: ${CATALOGUE_OPERATOR_ASSERTION_KEY_ID:-current}
    volumes:
      - operator-secrets:/run/operator-secrets:ro
    restart: unless-stopped

  # The public edge: an outbound-only connector publishing the explorer at
  # https://catalogue.dev.makersbrain.app. Nothing is published on the host and
  # no port is opened inbound — the connector dials Cloudflare, which is why
  # this can front a stack whose every other service is loopback or nothing.
  #
  # The tunnel is remotely managed (`config_src: cloudflare`), so the ingress
  # rule that maps the hostname to `http://explorer:3000` lives in the Zero
  # Trust dashboard rather than in a config file here. Changing where the
  # hostname points is an API/dashboard change, not a redeploy.
  #
  # Same profile as the explorer: there is nothing to publish without it.
  cloudflared:
    profiles: ["ui"]
    image: cloudflare/cloudflared:latest
    container_name: catalogue-cloudflared
    depends_on:
      - explorer
    # The image is distroless — no shell — so the connector token cannot be
    # read from a mounted secret file by an entrypoint wrapper. It comes in as
    # TUNNEL_TOKEN from a mode 0600 env file that is gitignored, rather than
    # from .env, so it is not sitting beside the development passwords.
    #
    #   deploy/secrets/cloudflared.env   TUNNEL_TOKEN=<connector token>
    env_file:
      - deploy/secrets/cloudflared.env
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    restart: unless-stopped
    healthcheck:
      # `ready` reports the number of live edge connections, and fails while
      # there are none — a connector that is running but has registered no
      # tunnel is exactly the failure this needs to catch.
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Optional, bounded operational metrics. Prometheus discovers every scaled
  # worker by Docker DNS; scraping a load-balanced worker name as one target
  # would mix process-local counters across replicas.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.5.0
    container_name: catalogue-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=14d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${CATALOGUE_PROMETHEUS_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:12.1.0
    container_name: catalogue-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${CATALOGUE_GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${CATALOGUE_GRAFANA_PASSWORD:-catalogue-local}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${CATALOGUE_GRAFANA_PORT:-3001}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  # JetStream is durable work delivery, not authoritative job state. It still
  # uses a named volume so an ordinary broker restart does not redeliver the
  # entire outbox reconstruction set.
  natsdata:
  # The recorded response cache. Not in the backup set: it is reproducible by
  # fetching, and it is hundreds of megabytes.
  cache:
  # The NDJSON artifacts. These *are* in the backup set — they are the audit
  # trail each job's recorded sha256 refers to.
  dumps:
  # Control replaces profiles.json atomically; workers mount the same volume
  # read-only and resolve a credential generation once per job.
  proxy-secrets:
  # Explorer-only copy of the assertion signing key. The one-shot initializer
  # preserves the host key's 0600 mode while assigning it to the container UID.
  operator-secrets:
  # Bounded by Prometheus' 14-day/2GB retention flags above.
  prometheus-data:
  grafana-data:

secrets:
  npmrc:
    file: ${NPMRC:-~/.npmrc}
